<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><title>Treino Fernando Mobile</title><style>
:root{--blue:#0b5cab;--blue2:#0e73d8;--light:#eef6ff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f9fc;--card:#fff;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink)}.app{max-width:980px;margin:auto;padding:0 14px 92px}.top{position:sticky;top:0;z-index:50;background:rgba(247,249,252,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 0}.hero{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:14px}h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.35}.progressWrap{margin-top:8px;background:white;border:1px solid var(--line);border-radius:16px;padding:8px}.progressText{font-size:12px;font-weight:800;color:#374151;display:flex;justify-content:space-between}.progress{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:6px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),#5bb4ff);width:0%;transition:.25s}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.tab{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 5px;font-weight:900;color:var(--muted)}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 10px;font-weight:800;font-size:14px;text-decoration:none;text-align:center}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.summary{background:linear-gradient(135deg,#fff,#eef6ff);border:1px solid #dbeafe;border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 8px 26px rgba(11,92,171,.08)}.summaryTop{display:flex;align-items:center;gap:12px}.summary img{width:43px;height:43px;border-radius:14px}.summary h2{margin:0;font-size:17px}.pill{display:inline-flex;margin-top:7px;background:#fff;border:1px solid #cfe7ff;color:var(--blue);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.exercise{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:12px 0;padding:13px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.exercise.done{border-color:#bbf7d0;background:#fbfffc}.head{display:flex;gap:10px;align-items:flex-start}.num{width:34px;height:34px;border-radius:12px;background:var(--light);color:var(--blue);font-weight:900;display:grid;place-items:center;flex:none}.head h3{font-size:17px;margin:0 0 6px}.meta{display:flex;flex-wrap:wrap;gap:6px}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 8px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.load{background:#eef6ff;color:var(--blue);border-color:#cfe7ff}.check{width:30px;height:30px}.how{font-size:14px;line-height:1.45;color:#374151;margin:10px 0}.videoArea{display:none;margin-top:10px;padding:10px;border:1px dashed #cbd5e1;background:#f8fafc;border-radius:16px}.videoArea.on{display:block}.yt{display:block;background:#111827;color:white;border-radius:14px;padding:13px;text-align:center;font-weight:900;text-decoration:none}.yt small{display:block;color:#cbd5e1;font-weight:600;margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px;z-index:60}.nav .inner{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:16px;padding:10px;font-size:13px;line-height:1.4;margin:12px 0}@media(min-width:740px){.tools{grid-template-columns:repeat(4,1fr)}h1{font-size:23px}}@media print{.top,.nav,.tools,.videoArea{display:none!important}.exercise{break-inside:avoid;box-shadow:none}}

lyY2xlIGN4PSIzMTIiIGN5PSIyMjQiIHI9IjM0IiBmaWxsPSIjNDFhMGZmIi8+PC9zdmc+"};const workouts=[{"id": "A", "name": "Treino A", "title": "Peito + tríceps + ombro lateral + core", "cardio": "Esteira 30 min | inclinação 6 | velocidade 6 km/h", "exercises": [{"name": "Supino inclinado no Smith", "sets": "4 x 8 a 10", "load": "A definir no teste", "how": "Banco entre 30 e 45 graus. Escápulas para trás e para baixo. Desça na parte superior do peito e suba controlando.", "url": "https://www.youtube.com/watch?v=mygqp11bhPQ", "icon": ""}, {"name": "Supino/crossover de baixo para cima", "sets": "3 x 10 a 12", "load": "15 kg por lado", "how": "Polias baixas. Movimento de baixo para cima, como supino inclinado. Cotovelos semiflexionados e peito contraído no topo.", "url": "https://www.youtube.com/watch?v=of00J3j83JE", "icon": ""}, {"name": "Supino/crossover reto", "sets": "3 x 10 a 12", "load": "15 kg por lado", "how": "Polias na altura do peito. Empurre para frente como supino. Controle a volta e proteja o ombro.", "url": "https://www.youtube.com/watch?v=of00J3j83JE", "icon": ""}, {"name": "Tríceps corda na polia", "sets": "4 x 10 a 15", "load": "30 kg, subir para 35 kg se fizer limpo", "how": "Cotovelos colados ao corpo. Empurre para baixo, abra a corda no final e volte controlando.", "url": "https://www.youtube.com/watch?v=KhK5HWJfsrQ", "icon": ""}, {"name": "Tríceps testa na polia", "sets": "3 x 10 a 12", "load": "30 kg, testar 35 kg se manter técnica", "how": "Cotovelos fixos. Alongue na volta e estenda sem roubar com ombro. Se cotovelo incomodar, reduza.", "url": "https://www.youtube.com/watch?v=KhK5HWJfsrQ", "icon": ""}, {"name": "Elevação lateral com halteres", "sets": "4 x 12 a 20", "load": "6 a 10 kg por halter", "how": "Suba até a linha dos ombros, sem encolher trapézio e sem balançar o corpo. Desça devagar.", "url": "https://www.youtube.com/watch?v=gURBTU9VSJg", "icon": ""}, {"name": "Crunch na polia em pé", "sets": "3 x 12 a 15", "load": "25 a 35 kg", "how": "Corda na polia alta. Contraia o abdômen levando costelas em direção ao quadril. Não puxe com os braços.", "url": "https://www.youtube.com/results?search_query=crunch+na+polia+em+pe+execucao+correta", "icon": ""}, {"name": "Cardio final", "sets": "30 min", "load": "Esteira inclinação 6, velocidade 6 km/h", "how": "Ritmo moderado: suado, mas sem sair destruído. Se joelho ou quadril incomodar, trocar por elíptico.", "url": "", "icon": "cardio"}]}, {"id": "B", "name": "Treino B", "title": "Costas + bíceps + ombro posterior + core", "cardio": "Esteira 25 a 30 min 6/6 ou elíptico", "exercises": [{"name": "Puxada alta frente", "sets": "4 x 8 a 12", "load": "A definir", "how": "Peito aberto. Puxe a barra até a parte alta do peito, com cotovelos para baixo. Evite jogar o tronco para trás.", "url": "https://www.youtube.com/watch?v=mPmfwbc_svw", "icon": ""}, {"name": "Remada baixa pulley com triângulo", "sets": "4 x 8 a 12", "load": "A definir", "how": "Coluna neutra, peito aberto. Puxe o triângulo em direção ao abdômen. Não balance o tronco.", "url": "https://www.youtube.com/watch?v=faRPzyxhO6M", "icon": ""}, {"name": "Remada unilateral no crossover", "sets": "3 x 10 a 12 cada lado", "load": "10 a 15 kg", "how": "Use estribo na polia baixa. Puxe o cotovelo para trás, segure 1 segundo e volte controlando.", "url": "https://www.youtube.com/watch?v=faRPzyxhO6M", "icon": ""}, {"name": "Face pull com corda", "sets": "3 x 12 a 15", "load": "15 a 25 kg", "how": "Polia na altura do rosto. Puxe a corda em direção ao rosto, cotovelos abertos e escápulas contraídas.", "url": "https://www.youtube.com/watch?v=SA1LdXQ-2F0", "icon": ""}, {"name": "Rosca direta com barra curta", "sets": "4 x 8 a 12", "load": "30 kg", "how": "Cotovelos próximos ao corpo. Suba sem jogar o tronco e desça controlando. Se roubar, reduza para 25 kg.", "url": "https://www.youtube.com/watch?v=hemxXmD6l4w", "icon": ""}, {"name": "Rosca unilateral no puxador individual", "sets": "3 x 10 a 12 cada lado", "load": "10 kg", "how": "Cotovelo parado. Suba contraindo o bíceps e desça devagar. Não gire o tronco.", "url": "https://www.youtube.com/results?search_query=rosca+unilateral+na+polia+execucao+correta", "icon": ""}, {"name": "Rosca concentrada", "sets": "2 a 3 x 10 a 12 cada lado", "load": "8 kg", "how": "Apoie o braço, controle total, suba contraindo e desça devagar. Não use impulso.", "url": "https://www.youtube.com/results?search_query=rosca+concentrada+execucao+correta", "icon": ""}, {"name": "Pallof press na polia", "sets": "3 x 10 a 15 cada lado", "load": "10 a 20 kg", "how": "Polia na altura do peito. Fique de lado, estenda os braços à frente e resista à rotação do tronco.", "url": "https://www.youtube.com/results?search_query=pallof+press+polia+execucao+correta", "icon": ""}, {"name": "Cardio final", "sets": "25 a 30 min", "load": "Esteira 6/6 ou elíptico", "how": "Se joelho/quadril estiverem bem, esteira. Se incomodar, elíptico em ritmo moderado.", "url": "", "icon": "cardio"}]}, {"id": "C", "name": "Treino C", "title": "Peito + ombro + braços + costas leve", "cardio": "Esteira 30 min | inclinação 6 | velocidade 6 km/h", "exercises": [{"name": "Supino/crossover alto para baixo", "sets": "3 x 10 a 12", "load": "15 kg por lado", "how": "Polias altas. Leve as mãos para frente e para baixo, contraindo o peitoral. Evite abrir demais o ombro.", "url": "https://www.youtube.com/watch?v=qEdyhsZcEk4", "icon": ""}, {"name": "Supino/crossover reto", "sets": "3 x 10 a 12", "load": "15 kg por lado", "how": "Polias na altura do peito. Empurre para frente como supino, controle a volta e mantenha peito ativo.", "url": "https://www.youtube.com/watch?v=of00J3j83JE", "icon": ""}, {"name": "Desenvolvimento com halteres sentado", "sets": "3 x 8 a 12", "load": "10 a 14 kg por halter para teste", "how": "Banco com encosto. Suba os halteres sem arquear a lombar. Desça até próximo da linha das orelhas.", "url": "https://www.youtube.com/watch?v=dQiH4lUDi6g", "icon": ""}, {"name": "Elevação lateral no cabo ou halteres", "sets": "4 x 12 a 20", "load": "Cabo 5 a 10 kg ou halter 6 a 10 kg", "how": "Suba até a linha do ombro, sem balanço. Descida lenta. Priorize controle, não carga.", "url": "https://www.youtube.com/watch?v=-Wvj5xP-k0Q", "icon": ""}, {"name": "Tríceps corda", "sets": "3 x 10 a 15", "load": "30 kg, 35 kg se estiver forte", "how": "Cotovelos fixos, extensão completa, abra a corda no final e volte controlando.", "url": "https://www.youtube.com/watch?v=KhK5HWJfsrQ", "icon": ""}, {"name": "Tríceps testa na polia", "sets": "2 x 10 a 12", "load": "30 kg", "how": "Volume reduzido para não sobrecarregar cotovelo. Movimento controlado, cotovelos fixos.", "url": "https://www.youtube.com/watch?v=KhK5HWJfsrQ", "icon": ""}, {"name": "Rosca direta barra curta", "sets": "3 x 8 a 12", "load": "30 kg", "how": "Cotovelos próximos ao corpo. Se estiver dolorido do Treino B, reduza para 25 kg.", "url": "https://www.youtube.com/watch?v=hemxXmD6l4w", "icon": ""}, {"name": "Rosca concentrada", "sets": "2 x 10 a 12 cada lado", "load": "8 kg", "how": "Foco em contração máxima. Subida controlada, descida lenta, sem impulso.", "url": "https://www.youtube.com/results?search_query=rosca+concentrada+execucao+correta", "icon": ""}, {"name": "Puxada alta ou remada baixa leve", "sets": "2 x 12 a 15", "load": "Moderada", "how": "Equilibra o ombro e mantém costas ativas. Não precisa ir até a falha.", "url": "https://www.youtube.com/watch?v=mPmfwbc_svw", "icon": ""}, {"name": "Core na polia: crunch ou Pallof", "sets": "3 séries", "load": "Crunch 25 a 35 kg ou Pallof 10 a 20 kg", "how": "Escolha uma opção. Crunch trabalha flexão do abdômen. Pallof trabalha antirotação e core lateral.", "url": "https://www.youtube.com/results?search_query=crunch+polia+em+pe+pallof+press", "icon": ""}, {"name": "Cardio final", "sets": "30 min", "load": "Esteira inclinação 6, velocidade 6 km/h", "how": "Ritmo moderado, suado, mas sem destruir a recuperação.", "url": "", "icon": "cardio"}]}, {"id": "D", "name": "Bônus", "title": "Cardio + pump de braços + ombro + core", "cardio": "35 a 45 min em ritmo contínuo", "exercises": [{"name": "Cardio principal", "sets": "35 a 45 min", "load": "Esteira 5 a 6 inclinação, 5,5 a 6 km/h ou elíptico/bike", "how": "Ritmo contínuo e moderado. Esse dia é para aumentar gasto calórico, não para se destruir.", "url": "", "icon": "cardio"}, {"name": "Tríceps corda", "sets": "3 x 12", "load": "25 a 30 kg", "how": "Carga menor que nos treinos principais. Movimento limpo, cotovelos fixos.", "url": "https://www.youtube.com/watch?v=KhK5HWJfsrQ", "icon": ""}, {"name": "Rosca direta barra curta", "sets": "3 x 12", "load": "25 a 30 kg", "how": "Controle total, sem jogar o tronco. Foco no pump.", "url": "https://www.youtube.com/watch?v=hemxXmD6l4w", "icon": ""}, {"name": "Elevação lateral", "sets": "3 x 15 a 20", "load": "Leve a moderada", "how": "Suba até a linha do ombro, com descida lenta. Não use impulso.", "url": "https://www.youtube.com/watch?v=gURBTU9VSJg", "icon": ""}, {"name": "Face pull", "sets": "3 x 15", "load": "15 a 25 kg", "how": "Cotovelos abertos, puxando para o rosto. Ótimo para ombro posterior e postura.", "url": "https://www.youtube.com/watch?v=SA1LdXQ-2F0", "icon": ""}, {"name": "Pallof press", "sets": "3 x 12 cada lado", "load": "10 a 20 kg", "how": "Segure o cabo à frente e resista à rotação. Abdômen firme o tempo todo.", "url": "https://www.youtube.com/results?search_query=pallof+press+polia+execucao+correta", "icon": ""}]}];let state=JSON.parse(localStorage.getItem('treinoFernandoMobile')||'{}');let active=state.active||'A';let showVideos=!!state.showVideos;let hideDone=!!state.hideDone;function save(){localStorage.setItem('treinoFernandoMobile',JSON.stringify(state))}function k(id,i){return 'done_'+id+'_'+i}function w(){return workouts.find(x=>x.id===active)}function comp(x){let d=x.exercises.filter((_,i)=>state[k(x.id,i)]).length;return [d,x.exercises.length,Math.round(d/x.exercises.length*100)]}function renderTabs(){tabs.innerHTML='';workouts.forEach(x=>{let b=document.createElement('button');b.className='tab'+(x.id===active?' active':'');b.textContent=x.name;b.onclick=()=>{active=x.id;state.active=active;save();render()};tabs.appendChild(b)})}function updateProgress(){let x=w(),[d,t,p]=comp(x);pTitle.textContent=x.name+' • '+d+'/'+t+' feitos';pPct.textContent=p+'%';pBar.style.width=p+'%'}function render(){renderTabs();updateProgress();let x=w();content.innerHTML='';let sum=document.createElement('section');sum.className='summary';sum.innerHTML=`<div class="summaryTop"><img src="${assets.arm}"><div><h2>${x.name}: ${x.title}</h2><div class="pill">${x.cardio}</div></div></div>`;content.appendChild(sum);x.exercises.forEach((ex,i)=>{let d=!!state[k(x.id,i)];if(hideDone&&d)return;let card=document.createElement('article');card.className='exercise'+(d?' done':'');card.id='ex-'+x.id+'-'+i;let icon=ex.icon==='cardio'?`<img src="${assets.cardio}" style="width:34px;height:34px;border-radius:12px">`:`<div class="num">${i+1}</div>`;let video=ex.url?`<div class="videoArea ${showVideos?'on':''}"><a class="yt" href="${ex.url}" target="_blank" rel="noopener">▶ Abrir vídeo no YouTube<small>${ex.name}</small></a></div>`:'';card.innerHTML=`<div class="head">${icon}<div style="flex:1"><h3>${ex.name}</h3><div class="meta"><span class="badge">${ex.sets}</span><span class="badge load">Carga: ${ex.load}</span></div></div><input class="check" type="checkbox" ${d?'checked':''}></div><p class="how">${ex.how}</p>${video}<button class="btn primary mark" style="width:100%;margin-top:10px">Marcar feito e próximo</button>`;card.querySelector('.check').onchange=e=>{state[k(x.id,i)]=e.target.checked;save();render()};card.querySelector('.mark').onclick=()=>{state[k(x.id,i)]=true;save();render();setTimeout(()=>scrollToNext(),80)};content.appendChild(card)});toggleVideos.textContent='Mostrar vídeos: '+(showVideos?'ON':'OFF');hideFinished.textContent=hideDone?'Mostrar feitos':'Ocultar feitos'}function scrollToNext(){let x=w();let idx=x.exercises.findIndex((_,i)=>!state[k(x.id,i)]);let el=document.getElementById('ex-'+active+'-'+(idx<0?0:idx));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}toggleVideos.onclick=()=>{showVideos=!showVideos;state.showVideos=showVideos;save();render()};hideFinished.onclick=()=>{hideDone=!hideDone;state.hideDone=hideDone;save();render()};resetDay.onclick=()=>{w().exercises.forEach((_,i)=>delete state[k(active,i)]);save();render()};next.onclick=scrollToNext;prev.onclick=()=>{let y=scrollY;let a=[...document.querySelectorAll('.exercise')];let p=a[0];for(let el of a){if(el.offsetTop<y-90)p=el}if(p)p.scrollIntoView({behavior:'smooth',block:'start'})};render();
