document.addEventListener('keydown',e=>{if($('#app').classList.contains('hidden')||!state.subject||!S[state.subject]?.cards)return;if(e.key==='ArrowRight')moveCard(1);if(e.key==='ArrowLeft')moveCard(-1)});
function modules(id){const s=S[id];show(`<div class="panel"><div class="print-title"><h1>MATERIAL DE ESTUDO – MATEMÁTICA</h1><p>Nome: __________________________</p></div><div class="panel-head"><div><div class="eyebrow">${s.icon} ${s.name}</div><h1>${s.theme}</h1></div><button class="btn alt no-print" onclick="window.print()">Imprimir material</button></div>${s.modules.map((m,k)=>`<details class="module" open><summary>${esc(m.title)}</summary><div class="inside"><h3>Conceito</h3><p>${esc(m.concept)}</p><div class="callout"><b>Exercício resolvido</b><p>${esc(m.solved)}</p></div><h3>Agora é sua vez</h3>${m.ex.map((e,i)=>`<div class="exercise"><b>${i+1}.</b> ${esc(e)}</div>`).join('')}<button class="btn alt no-print" onclick="this.nextElementSibling.classList.toggle('hidden')">Ver respostas comentadas</button><div class="answer-box hidden">${m.ans.map((a,i)=>`<p><b>${i+1}.</b> ${esc(a)}</p>`).join('')}</div></div></details>`).join('')}<div class="no-print"><button class="btn" onclick="quiz('matematica')">Fazer prova de Matemática</button></div></div>`)}
function quiz(id){state.subject=id;renderQuiz(S[id].quiz,S[id].name,false)}function simulado(){state.subject='simulado';renderQuiz(SIM,'Simulado Anglo',true)}
function renderQuiz(items,title,isSim){let saved=JSON.parse(localStorage.getItem('answers_'+state.subject)||'{}');show(`<div class="panel"><div class="print-title"><h1>${esc(title.toUpperCase())}</h1><p>Nome: ____________________ Turma: ______ Data: ___/___/_____ Nota: _____</p></div><div class="panel-head"><div><div class="eyebrow">${isSim?'🌟 Prova integrada':'Missão de avaliação'}</div><h1>${esc(title)}</h1><p>${items.length} questões • ${isSim?'Conteúdos integrados e situações do cotidiano':'Responda com atenção'}</p></div><button class="btn alt no-print" onclick="window.print()">Imprimir prova</button></div><div id="quizForm">${items.map((it,i)=>questionHTML(it,i,saved)).join('')}</div><div class="no-print" style="text-align:center;margin-top:25px"><button class="btn alt" onclick="clearQuiz()">Limpar</button> <button class="btn green" onclick="submitQuiz()">Enviar prova</button></div></div>`);document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('change',saveAnswers))}
function questionHTML(it,i,saved){let q=Array.isArray(it)?it[0]:it.q;if(Array.isArray(it)){return `<section class="question"><h3>${i+1}. ${esc(q)}</h3>${it[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${String(saved[i])===String(j)?'checked':''}>${String.fromCharCode(97+j)}) ${esc(o)}</label>`).join('')}</section>`}return `<section class="question"><h3>${i+1}. ${esc(q)}</h3><textarea name="q${i}" placeholder="Escreva sua resposta...">${esc(saved[i]||'')}</textarea></section>`}
function saveAnswers(){let a={};document.querySelectorAll('#quizForm input:checked,#quizForm textarea').forEach(x=>a[x.name.slice(1)]=x.value);localStorage.setItem('answers_'+state.subject,JSON.stringify(a))}
function clearQuiz(){if(confirm('Apagar todas as respostas desta prova?')){localStorage.removeItem('answers_'+state.subject);state.subject==='simulado'?simulado():quiz(state.subject)}}
function submitQuiz(){saveAnswers();const items=state.subject==='simulado'?SIM:S[state.subject].quiz,a=JSON.parse(localStorage.getItem('answers_'+state.subject)||'{}'),missing=items.filter((_,i)=>!String(a[i]??'').trim()).length;if(missing&&!confirm(`Há ${missing} questão(ões) sem resposta. Deseja enviar mesmo assim?`))return;let score=0,details=[];items.forEach((it,i)=>{let ok=false,user=a[i]??'';if(Array.isArray(it))ok=Number(user)===it[2];else{let norm=String(user).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let hits=it.keywords.filter(k=>norm.includes(String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,''))).length;ok=hits>=it.min}if(ok)score++;details.push({ok,user,it})});renderResult(items,details,score)}
function renderResult(items,details,score){let grade=(score/items.length*10).toFixed(1).replace('.',','),pct=Math.round(score/items.length*100),msg=pct>=90?'Excelente! Você dominou o conteúdo!':pct>=70?'Muito bom! Revise alguns pontos para avançar ainda mais.':pct>=50?'Você está no caminho certo. Revise as explicações.':'Cada tentativa é uma oportunidade. Estude e tente novamente!';show(`<div class="panel"><div class="print-title"><h1>RESULTADO – ${state.subject==='simulado'?'SIMULADO ANGLO':esc(S[state.subject].name)}</h1></div><div class="score"><p>${esc(localStorage.getItem('alunoP5')||'Aluno')}</p><strong>${grade}</strong><h2>${score} acertos de ${items.length} • ${pct}%</h2><p>${msg}</p></div><h2>Correção comentada</h2>${details.map((d,i)=>resultHTML(d,i)).join('')}<div class="no-print" style="text-align:center"><button class="btn alt" onclick="window.print()">Imprimir resultado</button> <button class="btn" onclick="localStorage.removeItem('answers_'+state.subject);state.subject==='simulado'?simulado():quiz(state.subject)">Refazer</button></div></div>`)}
function resultHTML(d,i){let it=d.it,correct=Array.isArray(it)?it[1][it[2]]:it.model,explain=Array.isArray(it)?it[3]:'Resposta aberta analisada por conceitos essenciais. Compare também com o modelo.';let user=Array.isArray(it)?(it[1][Number(d.user)]||'Não respondida'):(d.user||'Não respondida');return `<article class="result-card ${d.ok?'correct':'wrong'}"><h3>${d.ok?'✓':'✗'} Questão ${i+1}</h3><p><b>Sua resposta:</b> ${esc(user)}</p><p><b>Resposta esperada:</b> ${esc(correct)}</p><p><b>Por quê?</b> ${esc(explain)}</p></article>`}
</script></body></html>
